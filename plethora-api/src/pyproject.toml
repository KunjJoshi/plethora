[project]
name = "plethora-api"
version = "0.1.0"
description = "API REST Handlers for Database functionalities"
requires-python = ">=3.10"
dependencies = [
    "plethora-db",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.1.0"
]

[tool.uv.sources]
plethora-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "api",
    "config_api",
]
